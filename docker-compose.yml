version: '3.8'

services:
  bot-service:
    image: nuuvsen/bot-barbearia:latest
    build: .
    container_name: Bot-barbearia
    ports:
      - "3002:3001" # Evita o conflito da porta 3001 que você teve anteriormente
    volumes:
      # Isso salva a sessão do WhatsApp de forma persistente através do Docker. Pasta
      # nova (baileys_auth) porque migramos do whatsapp-web.js pro Baileys — a sessão
      # antiga (.wwebjs_auth) não é compatível com o formato do Baileys.
      - bot_auth_data:/usr/src/app/baileys_auth
    environment:
      # A porta que o Express vai rodar dentro do container
      - PORT=3001
      # 👇 Olha a mágica aqui: isso avisa o Portainer para puxar a variável da lista
      - FIREBASE_JSON=${FIREBASE_JSON}
    restart: always
    networks:
      - barbearia-net
    cpus: 2.0
    # Baileys não abre navegador (sem Chromium) — consumo de RAM cai de ~400MB pra
    # ~30-50MB. 300MB de teto dá bastante folga sem precisar de swap nenhuma.
    mem_limit: 300m
    memswap_limit: 300m

  # 🩺 Autoheal (28/09/2026): o HEALTHCHECK sozinho (definido nos Dockerfiles do bot e
  # do painel) só faz o Docker MARCAR um container como "unhealthy" — ele não reinicia
  # nada por conta própria. Esse serviço é um "vigia" bem pequeno (~5MB) que fica de
  # olho em TODO container do host que tenha HEALTHCHECK (AUTOHEAL_CONTAINER_LABEL=all,
  # inclusive os de outros docker-compose, como o do painel) e dá um "docker restart"
  # automático em qualquer um que ficar "unhealthy" — essencial numa TV Box fraca que
  # já travou várias vezes e ninguém percebia na hora.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=all
      - AUTOHEAL_INTERVAL=10
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

# Declaração do volume persistente
volumes:
  bot_auth_data:

networks:
  barbearia-net:
    external: true
    name: barbearia-networks